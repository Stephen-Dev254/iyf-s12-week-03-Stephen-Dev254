<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Stephen Muriu</title>
    <!-- FIXED: Pulls the stylesheet correctly from the root folder directory -->
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <!-- FIXED Navigation Structure for inside the pages/ folder -->
    <header>
        <h1>Stephen Muriu</h1>
        <nav aria-label="Main Navigation">
            <ul>
                <!-- Steps out to the root folder -->
                <li><a href="../index.html">Home</a></li>
                
                <!-- Links directly to neighbor files inside the same pages/ folder -->
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Get In Touch</h1>
        <form action="#" method="POST">
            <fieldset>
                <legend>Contact Information</legend>
                
                <p>
                    <label for="full-name">Full Name *</label>
                    <input type="text" id="full-name" name="fullName" placeholder="Stephen Githaiga Muriu" required>
                </p>

                <p>
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" placeholder="stephengithaigamuriu@gmail.com" required>
                </p>

                <p>
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+254 712 345 678">
                </p>
            </fieldset>

            <fieldset>
                <legend>Message Details</legend>

                <p>
                    <label for="subject">Subject *</label>
                    <select id="subject" name="subject" required>
                        <option value="" disabled selected>Select an option...</option>
                        <option value="general">General Inquiry</option>
                        <option value="project">Project Proposal</option>
                        <option value="support">Technical Support</option>
                    </select>
                </p>

                <p>
                    <label for="message">Message * (Minimum 50 characters)</label>
                    <textarea id="message" name="message" rows="6" minlength="50" placeholder="Please write your detailed message here..." required></textarea>
                </p>
            </fieldset>

            <fieldset>
                <legend>Preferences</legend>
                <p>
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Subscribe to our monthly newsletter</label>
                </p>
            </fieldset>

            <p>
                <button type="submit">Submit</button>
            </p>
        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Stephen Muriu | Stephen-Dev254</p>
    </footer>

</body>
</html>
